<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Orders - EduVault</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .account-page {
      min-height: 100vh;
      background: #0f1413;
      padding: 40px 20px;
      color: #fdf1e1;
    }
    .account-container {
      max-width: 900px;
      margin: 0 auto;
    }
    .account-header {
      margin-bottom: 40px;
    }
    .account-header h1 {
      font-family: "Ogg Medium", serif;
      font-size: 2.5rem;
      margin: 0 0 10px;
    }
    .account-header p {
      color: rgba(253, 241, 225, 0.6);
      font-size: 1rem;
    }
    .order-card {
      background: rgba(253, 241, 225, 0.04);
      border: 1px solid rgba(253, 241, 225, 0.12);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
    }
    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(253, 241, 225, 0.08);
    }
    .order-id {
      font-size: 0.9rem;
      color: rgba(253, 241, 225, 0.5);
      margin-bottom: 4px;
    }
    .order-date {
      font-size: 0.85rem;
      color: rgba(253, 241, 225, 0.4);
    }
    .order-status {
      background: #2d7a4f;
      color: #fff;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .order-items {
      margin-bottom: 20px;
    }
    .order-item {
      display: flex;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(253, 241, 225, 0.06);
    }
    .order-item:last-child {
      border-bottom: none;
    }
    .order-item-img {
      width: 60px;
      height: 60px;
      border-radius: 8px;
      object-fit: cover;
      background: rgba(253, 241, 225, 0.06);
    }
    .order-item-info {
      flex: 1;
    }
    .order-item-name {
      font-size: 1rem;
      font-weight: 600;
      margin: 0 0 4px;
    }
    .order-item-price {
      font-size: 0.9rem;
      color: rgba(253, 241, 225, 0.6);
    }
    .order-item-access {
      font-size: 0.8rem;
      color: rgba(253, 241, 225, 0.4);
      margin-top: 4px;
    }
    .download-btn {
      padding: 8px 16px;
      background: #fdf1e1;
      color: #111411;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.2s;
    }
    .download-btn:hover {
      opacity: 0.88;
    }
    .order-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 16px;
      border-top: 1px solid rgba(253, 241, 225, 0.08);
      font-size: 1.1rem;
      font-weight: 700;
    }
    .no-orders {
      text-align: center;
      padding: 60px 20px;
      color: rgba(253, 241, 225, 0.5);
    }
    .no-orders h2 {
      font-family: "Ogg Medium", serif;
      font-size: 2rem;
      margin: 0 0 12px;
      color: #fdf1e1;
    }
    .no-orders p {
      margin: 0 0 24px;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: rgba(253, 241, 225, 0.7);
      text-decoration: none;
      margin-bottom: 20px;
      transition: color 0.2s;
    }
    .back-link:hover {
      color: #fdf1e1;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: rgba(253, 241, 225, 0.5);
    }
  </style>
</head>
<body>
  <div class="account-page">
    <div class="account-container">
      <a href="index.html" class="back-link">← Back to Home</a>
      
      <div class="account-header">
        <h1>My Orders</h1>
        <p>View your purchases and download your digital products</p>
      </div>

      <div id="orders-container">
        <div class="loading">Loading your orders...</div>
      </div>
    </div>
  </div>

  <script>
    async function loadOrders() {
      const container = document.getElementById('orders-container');
      
      // Get customer email from URL or localStorage
      const urlParams = new URLSearchParams(window.location.search);
      const customerEmail = urlParams.get('email') || localStorage.getItem('customer_email');
      
      if (!customerEmail) {
        container.innerHTML = `
          <div class="no-orders">
            <h2>No Orders Found</h2>
            <p>Please enter your email to view your orders</p>
            <input type="email" id="email-input" placeholder="Enter your email" style="padding: 12px 16px; border-radius: 10px; border: 1px solid rgba(253,241,225,0.2); background: rgba(253,241,225,0.06); color: #fdf1e1; font-size: 1rem; width: 300px; max-width: 100%; margin-bottom: 12px;" />
            <br>
            <button onclick="viewOrders()" style="padding: 12px 28px; background: #fdf1e1; color: #111411; border-radius: 10px; font-weight: 600; cursor: pointer; border: none;">View Orders</button>
          </div>
        `;
        return;
      }
      
      try {
        const res = await fetch('/api/orders');
        const orders = await res.json();
        
        // Filter orders for this customer
        const customerOrders = orders.filter(o => o.customerEmail === customerEmail);
        
        if (customerOrders.length === 0) {
          container.innerHTML = `
            <div class="no-orders">
              <h2>No Orders Yet</h2>
              <p>You haven't made any purchases yet.</p>
              <a href="index.html" style="display: inline-block; padding: 12px 28px; background: #fdf1e1; color: #111411; border-radius: 10px; font-weight: 600; text-decoration: none;">Browse Products</a>
            </div>
          `;
          return;
        }
        
        container.innerHTML = customerOrders.map(order => `
          <div class="order-card">
            <div class="order-header">
              <div>
                <div class="order-id">Order #${order.id}</div>
                <div class="order-date">${new Date(order.createdAt).toLocaleDateString('en-IN', { year: 'numeric', month: 'long', day: 'numeric' })}</div>
              </div>
              <div class="order-status">${order.status}</div>
            </div>
            
            <div class="order-items">
              ${order.items.map(item => `
                <div class="order-item">
                  <img src="${item.img}" alt="${item.name}" class="order-item-img" />
                  <div class="order-item-info">
                    <h4 class="order-item-name">${item.name}</h4>
                    <div class="order-item-price">₹${item.price} × ${item.qty}</div>
                    <div class="order-item-access">Access until: ${new Date(item.accessExpiry).toLocaleDateString('en-IN')}</div>
                  </div>
                  <a href="${item.downloadLink}" class="download-btn" target="_blank">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                      <polyline points="7 10 12 15 17 10"/>
                      <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Download
                  </a>
                </div>
              `).join('')}
            </div>
            
            <div class="order-total">
              <span>Total Paid:</span>
              <span>₹${order.total}</span>
            </div>
          </div>
        `).join('');
        
      } catch (err) {
        container.innerHTML = '<div class="no-orders"><h2>Error Loading Orders</h2><p>Please try again later.</p></div>';
      }
    }
    
    function viewOrders() {
      const email = document.getElementById('email-input').value.trim();
      if (email) {
        localStorage.setItem('customer_email', email);
        window.location.href = '/account.html?email=' + encodeURIComponent(email);
      }
    }
    
    loadOrders();
  </script>
</body>
</html>
